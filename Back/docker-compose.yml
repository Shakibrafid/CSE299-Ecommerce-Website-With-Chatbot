version: "3.9"

services:
  django:
    build: .
    container_name: django_app

    ports:
      - "8000:8000"

    volumes:
      - .:/app
      - sqlite_data:/app/data

    environment:
      - SQLITE_PATH=/app/data/db.sqlite3

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

volumes:
  sqlite_data: